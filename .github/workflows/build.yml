name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Arman VPN version (e.g. 1.0.18)"
        required: true
        default: "1.0.18"
      arch:
        description: "Architecture (amd64 / arm64 / both)"
        required: true
        default: "both"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine platforms
        id: platforms
        run: |
          case "${{ inputs.arch }}" in
            amd64) echo "platforms=linux/amd64" >> $GITHUB_OUTPUT ;;
            arm64) echo "platforms=linux/arm64" >> $GITHUB_OUTPUT ;;
            both)  echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT ;;
            *)     echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
