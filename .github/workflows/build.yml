name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Arman VPN version (e.g. 1.0.18)"
        required: true
        default: "1.0.18"
      arch:
        description: "Architecture (amd64 / arm64 / both)"
        required: true
        default: "both"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine platforms
        id: platforms
        run: |
          case "${{ inputs.arch }}" in
            amd64) echo "platforms=linux/amd64" >> $GITHUB_OUTPUT ;;
            arm64) echo "platforms=linux/arm64" >> $GITHUB_OUTPUT ;;
            both)  echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT ;;
            *)     echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT ;;
          esac

      - name: Sanitize image name
        id: image
        run: |
          # github.repository = owner/repo-name
          # 仓库名可能以 - 开头（Docker 不允许），去掉前导 -
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(basename "${{ github.repository }}")
          # 去掉前导 -，转小写
          REPO=$(echo "$REPO" | sed 's/^-*//' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/${REPO}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
